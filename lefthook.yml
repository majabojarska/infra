# Lefthook configuration for infrastructure repository
# https://github.com/evilmartians/lefthook

pre-commit:
  parallel: true
  commands:
    # Security: Check for leaked secrets
    gitleaks:
      glob: "*.{yaml,yml,json,tf,sh,nix}"
      run: gitleaks protect --verbose --redact --staged --config .gitleaks.toml {staged_files}

    # YAML linting
    yamllint:
      glob: "*.{yaml,yml}"
      exclude: ".pre-commit-config.yaml"
      run: |
        if command -v yamllint >/dev/null 2>&1; then
          yamllint {staged_files}
        else
          echo "⚠️  yamllint not installed, skipping"
        fi

    # Ansible linting
    ansible-lint:
      glob: "ansible/**/*.{yaml,yml}"
      run: |
        if command -v ansible-lint >/dev/null 2>&1; then
          ansible-lint {staged_files}
        else
          echo "⚠️  ansible-lint not installed, skipping"
        fi

    # NixOS configuration check
    nix-check:
      glob: "**/*.nix"
      run: |
        if command -v nix >/dev/null 2>&1; then
          nix flake check --no-build ./ansible/roles/majabojarska.nixos/nix
        else
          echo "⚠️  nix not installed, skipping"
        fi

    # Kubernetes manifest validation
    kubeconform:
      glob: "kubernetes/**/*.{yaml,yml}"
      run: |
        if command -v kubeconform >/dev/null 2>&1; then
          kubeconform -strict -ignore-missing-schemas {staged_files}
        else
          echo "⚠️  kubeconform not installed, skipping"
        fi

    # GitHub Actions workflow validation
    actionlint:
      glob: ".github/workflows/*.{yaml,yml}"
      run: |
        if command -v actionlint >/dev/null 2>&1; then
          actionlint {staged_files}
        else
          echo "⚠️  actionlint not installed, skipping"
        fi

    # Renovate config validation
    renovate-config-validator:
      glob: "{.github/,}renovate.json{5,}"
      run: |
        if command -v renovate-config-validator >/dev/null 2>&1; then
          renovate-config-validator --strict {staged_files}
        else
          echo "⚠️  renovate-config-validator not installed, skipping"
        fi

    # Check for merge conflict markers
    merge-conflict-check:
      glob: "*"
      run: |
        if grep -HnE '^(<{7}|={7}|>{7})( |$)' {staged_files}; then
          echo "❌ Merge conflict markers detected!"
          exit 1
        fi

    # Trim trailing whitespace
    trailing-whitespace:
      glob: "*.{yaml,yml,md,nix,sh,tf}"
      run: |
        for file in {staged_files}; do
          if [ -f "$file" ]; then
            sed -i 's/[[:space:]]*$//' "$file"
            git add "$file"
          fi
        done

pre-push:
  parallel: false
  commands:
    # Commitizen check
    commitizen:
      run: |
        if command -v cz >/dev/null 2>&1; then
          cz check --rev-range origin/main..HEAD
        else
          echo "⚠️  commitizen not installed, skipping"
        fi

    # Run full gitleaks scan
    gitleaks-full:
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks detect --verbose --redact --config .gitleaks.toml
        else
          echo "⚠️  gitleaks not installed, skipping"
        fi

commit-msg:
  commands:
    # Validate commit message format
    commitizen-msg:
      run: |
        if command -v cz >/dev/null 2>&1; then
          cz check --commit-msg-file {1}
        else
          echo "⚠️  commitizen not installed, skipping"
        fi

# Skip hooks on these branches
skip_output:
  - meta
  - rebase
  - merge

# Skip installation of missing commands
no_tty: false
