apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: miniflux-cnpg-auth
spec:
  refreshInterval: "24h"
  target:
    name: miniflux-cnpg-auth
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: "miniflux"
        password: "{{ .password }}"
        std: "postgresql://miniflux:{{ .password }}@miniflux-cnpg-main-rw:5432/miniflux"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: pg-password-generator
