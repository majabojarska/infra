apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: audiomuse-ai
spec:
  instances: 1
  storage:
    size: 10Gi
  managed:
    roles:
      - name: audiomuse
        login: true
        passwordSecret:
          name: audiomuse-ai
  bootstrap:
    initdb:
      database: audiomuse
      owner: audiomuse
